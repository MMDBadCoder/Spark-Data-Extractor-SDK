[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-extractor"
version = "0.1.0"
description = "Spark Connect extraction SDK with Persian guidance and WebHDFS downloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7", "requests>=2.32.3,<3"]

[project.optional-dependencies]
connect = ["pyspark[connect]==4.0.1"]
dev = ["build>=1.2,<2", "coverage>=7.6,<8", "pytest>=8,<10"]

[project.scripts]
data-extractor = "data_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_extractor = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["data_extractor"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
